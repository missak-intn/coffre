<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coffre">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Coffre</title>
<style>
:root{--bg:#111214;--card:#1c1e22;--fg:#f2f3f5;--mut:#8b8f98;--acc:#4c9aff;--red:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body.cover #app,body.cover #viewer,body.cover #sheet{visibility:hidden}
[hidden]{display:none!important}
button{font:inherit;color:var(--fg);background:var(--card);border:0;border-radius:10px;padding:9px 14px}
button.p{background:var(--acc);color:#fff}
button.d{color:var(--red)}
button.l{background:none;padding:6px 8px;color:var(--acc)}
input[type=password],input[type=text]{font:inherit;width:100%;padding:13px;border-radius:10px;border:1px solid #33363c;background:var(--card);color:var(--fg);-webkit-user-select:text;user-select:text}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px 32px;max-width:420px;margin:auto}
#lock h1{margin:0 0 4px;font-size:28px}
#lock p{margin:0;color:var(--mut);font-size:14px}
#msg{color:var(--red);min-height:20px;text-align:center}
#dots{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;min-height:28px;padding:4px 0}
#dots:empty::before{content:"Entre ton code";color:var(--mut);font-size:14px}
#dots i{width:14px;height:14px;border-radius:50%;background:var(--fg)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:300px;margin:0 auto}
#pad button{height:60px;font-size:26px;padding:0;border-radius:16px}
#pad button:active{background:#2a2d33}
#fidrow{display:flex;justify-content:center;padding:6px 12px 18px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:rgba(17,18,20,.92);backdrop-filter:blur(12px)}
header h2{flex:1;margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{padding-bottom:calc(env(safe-area-inset-bottom) + 90px);min-height:100%}
.albums{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px}
.card{border-radius:12px}
.cover{aspect-ratio:1;background:var(--card);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:34px}
.cover img{width:100%;height:100%;object-fit:cover}
.card b{display:block;margin-top:6px;font-weight:600;font-size:15px}
.card span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{position:relative;aspect-ratio:1;background:var(--card);overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell.s::after{content:"✓";position:absolute;inset:0;background:rgba(76,154,255,.45);display:flex;align-items:flex-end;justify-content:flex-end;padding:6px;font-size:22px;font-weight:700}
.empty{color:var(--mut);text-align:center;padding:60px 30px;line-height:1.5}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,var(--bg) 40%)}
#bar button{padding:9px 12px;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.note{color:var(--mut);font-size:13px;text-align:center;padding:6px 16px 10px}
#viewer{position:fixed;inset:0;z-index:20;background:#000;overflow:hidden}
#vtop,#vbot{position:absolute;left:0;right:0;z-index:2;color:#fff;transition:opacity .2s}
#vtop{top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 6px) 12px 22px;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0))}
#vbot{bottom:0;padding:26px 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7))}
#vtop button,#vbot button,#vtop span,#vbot span{text-shadow:0 1px 3px rgba(0,0,0,.8)}
#vrow{display:flex;align-items:center;justify-content:space-between}
#vctrl{display:flex;align-items:center;gap:10px;padding:0 4px 8px;font-size:13px;font-variant-numeric:tabular-nums}
#vctrl[hidden]{display:none}
#vplay{background:none;color:#fff;font-size:22px;padding:4px 8px;min-width:40px}
#vseek{flex:1;min-width:0;accent-color:#fff;touch-action:pan-x}
#viewer.hide #vtop,#viewer.hide #vbot{opacity:0;pointer-events:none}
#vwrap{position:absolute;inset:0;overflow:hidden;touch-action:none}
#vzoom{position:absolute;inset:0;transform-origin:50% 50%}
#vzoom.anim{transition:transform .22s ease-out}
#vimg,#vvid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-touch-callout:none}
#vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--mut);line-height:1.5;pointer-events:none}
.vb{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);border-radius:6px;padding:1px 7px;font-size:12px}
#sheetbg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
#sheet{width:100%;max-height:75%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
#sheet h3{margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid #2a2d33}
.row .ck{width:26px;height:26px;border-radius:50%;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.row .ck.on{background:var(--acc);border-color:var(--acc)}
.row .ck.mid{border-color:var(--acc);color:var(--acc)}
.row .n{flex:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:#2b2e34;padding:10px 16px;border-radius:20px;z-index:60;font-size:14px}
</style>
</head>
<body>
<div id="lock" hidden>
  <h1>🔒 Coffre</h1>
  <p id="lockinfo"></p>
  <input type="password" id="pin" inputmode="numeric" placeholder="Code" autocomplete="off" hidden>
  <input type="password" id="pin2" inputmode="numeric" placeholder="Confirmer le code" autocomplete="off" hidden>
  <div id="dots" hidden></div>
  <div id="pad" hidden></div>
  <div id="msg"></div>
  <button class="p" id="fid" hidden>Déverrouiller avec Face ID</button>
  <button class="p" id="go">Déverrouiller</button>
  <button class="l" id="kbd" hidden>Clavier ABC</button>
  <button class="l" id="restore" hidden>Restaurer une sauvegarde</button>
  <input type="file" id="restoref" hidden>
</div>

<div id="app"></div>
<div id="bar" hidden></div>
<input type="file" id="picker" accept="image/*,video/*" multiple hidden>

<div id="viewer" hidden>
  <div id="vwrap"><div id="vzoom"><img id="vimg" alt=""><video id="vvid" playsinline loop hidden></video></div><div id="vmsg" hidden>Cette image ne peut pas s’afficher ici (format ou taille non pris en charge).<br>Utilise « Exporter » pour la récupérer.</div></div>
  <div id="vtop"><button class="l" id="vclose">Fermer</button><span id="vcount"></span><button class="l" id="valb">Albums</button></div>
  <div id="vbot">
    <div id="vctrl" hidden><button id="vplay" aria-label="Lecture / pause">⏸</button><span id="vcur">0:00</span><input type="range" id="vseek" min="0" max="1000" value="0"><span id="vdur">0:00</span></div>
    <div id="vrow"><button class="d" id="vdel">Supprimer</button><button class="l" id="vexp">Exporter</button><span><button class="l" id="vprev" style="font-size:26px;padding:0 14px">‹</button><button class="l" id="vnext" style="font-size:26px;padding:0 14px">›</button></span></div>
  </div></div>
</div>
<div id="sheetbg" hidden><div id="sheet"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const E=new TextEncoder(), D=new TextDecoder();
let KEY=null, META={albums:[]}, IDS=[], view={t:'home'}, sel=null, V=null, hiddenAt=0;
const thumbURL=new Map();

/* ---------- IndexedDB ---------- */
const dbp=new Promise((res,rej)=>{
  const r=indexedDB.open('coffre',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('photos',{keyPath:'id'});d.createObjectStore('thumbs',{keyPath:'id'});d.createObjectStore('kv');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
function tx(st,mode,fn){return dbp.then(db=>new Promise((res,rej)=>{
  const t=db.transaction(st,mode),s=t.objectStore(st),r=fn(s);
  t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
}));}
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const get=(st,id)=>tx(st,'readonly',s=>s.get(id));
const put=(st,o)=>tx(st,'readwrite',s=>s.put(o));
const del=(st,id)=>tx(st,'readwrite',s=>s.delete(id));
const keys=st=>tx(st,'readonly',s=>s.getAllKeys());

/* ---------- Crypto ---------- */
async function deriveKey(pin,salt){
  const km=await crypto.subtle.importKey('raw',E.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encBuf(buf){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,buf));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return out.buffer;
}
async function decBuf(b,k=KEY){
  const u=new Uint8Array(b);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12));
}
const saveMeta=async()=>kvSet('meta',await encBuf(E.encode(JSON.stringify(META))));

/* ---------- Utils ---------- */
function toast(t,ms=2200){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.append(e);}e.textContent=t;e.hidden=false;clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>e.hidden=true,ms);}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newId=()=>Date.now().toString(36).padStart(9,'0')+Math.random().toString(36).slice(2,7);
const album=id=>META.albums.find(a=>a.id===id);
const isVid=id=>(META.vids||[]).includes(id);
const TRASH_DAYS=30, EXPORT_MAX=250*1024*1024;
const cnt=n=>n+' élément'+(n>1?'s':'');
const trashIds=()=>META.trash.slice().sort((a,b)=>b.at-a.at).map(t=>t.id);
const EXT={'image/jpeg':'jpg','image/png':'png','image/heic':'heic','image/heif':'heif','image/webp':'webp','image/gif':'gif','video/mp4':'mp4','video/quicktime':'mov','video/x-m4v':'m4v'};
const exportName=(id,type)=>'coffre-'+id+'.'+(EXT[type]||((type||'').startsWith('video/')?'mp4':'jpg'));
const mb=b=>(b/1048576).toFixed(b<10485760?1:0)+' Mo';
function curIds(){
  if(view.t==='all')return IDS;
  if(view.t==='trash')return trashIds();
  const a=album(view.id);if(!a)return [];
  const s=new Set(a.ids);return IDS.filter(i=>s.has(i));
}
const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){io.unobserve(e.target);loadThumb(e.target.dataset.id,e.target);}},{rootMargin:'300px'});
async function loadThumb(id,img){
  try{
    if(!thumbURL.has(id)){
      const r=await get('thumbs',id);if(!r)return;
      const b=await decBuf(r.d);thumbURL.set(id,URL.createObjectURL(new Blob([b],{type:'image/jpeg'})));
    }
    img.src=thumbURL.get(id);
  }catch(e){}
}
function thumbImg(id){const i=document.createElement('img');i.dataset.id=id;i.alt='';io.observe(i);return i;}

/* ---------- Lock / setup ---------- */
let setupMode=false, entry='', abc=false, PLEN=0, FID_OK=false, FID_ON=false, faceBusy=false, unlocking=false;
const fidAvail=(window.PublicKeyCredential&&navigator.credentials&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)
  ?PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(()=>false):Promise.resolve(false);
const kvDel=k=>tx('kv','readwrite',s=>s.delete(k));
async function boot(){
  const salt=await kvGet('salt');
  setupMode=!salt;entry='';abc=false;
  PLEN=Number(await kvGet('plen'))||0;
  $('#lock').hidden=false;
  $('#pin').hidden=!setupMode;$('#pin2').hidden=!setupMode;
  $('#pin').setAttribute('inputmode',setupMode?'numeric':'text');
  $('#pad').hidden=setupMode;$('#dots').hidden=setupMode;$('#kbd').hidden=setupMode;
  $('#kbd').textContent='Clavier ABC';
  $('#fid').hidden=true;
  $('#restore').hidden=!setupMode;
  $('#go').textContent=setupMode?'Créer le coffre':'Déverrouiller';
  $('#lockinfo').textContent=setupMode?'Choisis un code d’au moins 6 chiffres (8 ou plus, c’est mieux). Il chiffre tes photos : s’il est perdu, elles sont irrécupérables.':'';
  $('#pin').value='';$('#pin2').value='';$('#msg').textContent='';
  drawDots();
  if(setupMode)return;
  FID_OK=await fidAvail;
  const f=FID_OK?await kvGet('fid'):null;
  if(f&&!KEY){$('#fid').hidden=false;faceUnlock(true);}
}
const msg=t=>$('#msg').textContent=t;

/* Pavé numérique intégré : s’affiche tout de suite, sans toucher de champ (iOS interdit d’ouvrir le clavier tout seul) */
const pad=$('#pad');
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
  if(!k){pad.append(document.createElement('span'));return;}
  const b=document.createElement('button');b.type='button';b.textContent=k;b.dataset.k=k;
  if(k==='⌫')b.setAttribute('aria-label','Effacer');
  b.onclick=()=>k==='⌫'?back():press(k);
  pad.append(b);
});
function drawDots(){const d=$('#dots');d.innerHTML='';for(let i=0;i<entry.length;i++)d.append(document.createElement('i'));}
function press(k){
  if(unlocking||setupMode||abc||entry.length>=32)return;
  entry+=k;drawDots();msg('');
  if(PLEN&&entry.length===PLEN)$('#go').click();   // déverrouillage automatique à la bonne longueur
}
function back(){if(unlocking)return;entry=entry.slice(0,-1);drawDots();}
$('#kbd').onclick=()=>{
  abc=!abc;entry='';drawDots();$('#pin').value='';msg('');
  $('#pin').hidden=!abc;$('#pad').hidden=abc;$('#dots').hidden=abc;
  $('#kbd').textContent=abc?'Clavier numérique':'Clavier ABC';
  if(abc)$('#pin').focus();
};
document.addEventListener('keydown',e=>{
  if($('#lock').hidden||setupMode||abc||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^\d$/.test(e.key))press(e.key);
  else if(e.key==='Backspace')back();
  else if(e.key==='Enter')$('#go').click();
});

/* Face ID (WebAuthn, authentificateur de la plateforme) : sert de verrou, le code reste le secours */
async function faceUnlock(auto){
  if(faceBusy||KEY||unlocking)return;
  faceBusy=true;
  try{
    const f=await kvGet('fid');if(!f)return;
    const cred=await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{id:f.cid,type:'public-key',transports:['internal']}],
      userVerification:'required',timeout:60000}});
    if(KEY)return;
    const ad=new Uint8Array(cred.response.authenticatorData);
    if(!(ad[32]&4))throw new Error('verification utilisateur absente');
    await decBuf(await kvGet('check'),f.key);
    KEY=f.key;
    await enter();
  }catch(e){
    console.warn('faceid',e&&e.name,e&&e.message);
    if(!auto)msg('Face ID annulé ou non reconnu. Utilise ton code.');
  }finally{faceBusy=false;}
}
$('#fid').onclick=()=>faceUnlock(false);
async function enableFaceId(){
  try{
    const cred=await navigator.credentials.create({publicKey:{
      rp:{name:'Coffre'},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'coffre',displayName:'Coffre'},
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
      attestation:'none',timeout:60000}});
    await kvSet('fid',{cid:cred.rawId,key:KEY});
    const f=await kvGet('fid');
    await decBuf(await kvGet('check'),f.key);   // vérifie que la clé stockée fonctionne bien
    FID_ON=true;render();toast('Face ID activé');
  }catch(e){
    console.warn('faceid-enable',e);
    await kvDel('fid').catch(()=>{});FID_ON=false;render();
    toast('Face ID indisponible ici. Le code reste actif.',4000);
  }
}
async function disableFaceId(){await kvDel('fid');FID_ON=false;render();toast('Face ID désactivé');}
async function enter(){
  await loadAll();
  FID_OK=await fidAvail;
  FID_ON=FID_OK&&!!(await kvGet('fid'));
  $('#lock').hidden=true;view={t:'home'};sel=null;render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
}
$('#go').onclick=async()=>{
  if(unlocking)return;
  const pin=(setupMode||abc)?$('#pin').value:entry;msg('');
  const btn=$('#go');btn.disabled=true;unlocking=true;
  try{
    if(setupMode){
      if(!/^\d{6,}$/.test(pin))return msg('6 chiffres minimum.');
      if(pin!==$('#pin2').value)return msg('Les codes ne correspondent pas.');
      const salt=crypto.getRandomValues(new Uint8Array(16));
      KEY=await deriveKey(pin,salt);
      await kvSet('salt',salt);await kvSet('check',await encBuf(E.encode('ok')));
      META={albums:[],vids:[],trash:[]};await saveMeta();
    }else{
      const salt=await kvGet('salt');const k=await deriveKey(pin,salt);
      try{await decBuf(await kvGet('check'),k);}catch(e){
        await new Promise(r=>setTimeout(r,1000));
        entry='';drawDots();$('#pin').value='';
        return msg('Code incorrect.');
      }
      KEY=k;
    }
    // longueur du code (si 100 % chiffres) : permet le déverrouillage automatique au dernier chiffre
    PLEN=/^\d+$/.test(pin)?pin.length:0;await kvSet('plen',PLEN);
    entry='';drawDots();
    await enter();
  }finally{btn.disabled=false;unlocking=false;}
};
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter'&&!setupMode)$('#go').click();});
async function loadAll(){
  const m=await kvGet('meta');
  META=m?JSON.parse(D.decode(await decBuf(m))):{albums:[]};
  if(!META.vids)META.vids=[];
  if(!META.trash)META.trash=[];
  IDS=[];
  const limit=Date.now()-TRASH_DAYS*86400000;
  const old=META.trash.filter(t=>t.at<limit).map(t=>t.id);
  if(old.length)await purge(old,true);
  const tr=new Set(META.trash.map(t=>t.id));
  IDS=(await keys('thumbs')).sort().reverse().filter(i=>!tr.has(i));
}
function lock(){
  if(V)closeViewer();
  KEY=null;META={albums:[],vids:[],trash:[]};IDS=[];sel=null;
  for(const u of thumbURL.values())URL.revokeObjectURL(u);thumbURL.clear();
  $('#app').innerHTML='';$('#bar').hidden=true;$('#viewer').hidden=true;$('#vimg').removeAttribute('src');$('#sheetbg').hidden=true;
  boot();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();document.body.classList.add('cover');$('#vvid').pause();}
  else{document.body.classList.remove('cover');if(KEY&&Date.now()-hiddenAt>30000)lock();}
});

/* ---------- Render ---------- */
function render(){
  const app=$('#app');app.innerHTML='';
  if(view.t==='home')renderHome(app);else renderGrid(app);
  renderBar();
}
function header(title,left,right){
  const h=document.createElement('header');
  if(left)h.append(left);
  const t=document.createElement('h2');t.textContent=title;h.append(t);
  for(const b of right)h.append(b);
  return h;
}
function btn(label,fn,cls='l'){const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;return b;}

function renderHome(app){
  app.append(header('Coffre',null,[btn('Sauvegarde',backupMenu),btn('Verrouiller',lock)]));
  const g=document.createElement('div');g.className='albums';
  g.append(card('Toutes les photos',cnt(IDS.length),IDS[0],()=>{view={t:'all'};sel=null;render();}));
  for(const a of META.albums){
    const ids=IDS.filter(i=>a.ids.includes(i));
    g.append(card(a.name,cnt(ids.length),ids[0],()=>{view={t:'album',id:a.id};sel=null;render();}));
  }
  const n=document.createElement('div');n.className='card';n.onclick=newAlbumPrompt;
  n.innerHTML='<div class="cover">＋</div><b>Nouvel album</b>';
  g.append(n);
  const tids=trashIds();

/* ---------- Photos ---------- */
async function makeThumb(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){
    const u=URL.createObjectURL(file);
    bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});
  }
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,s=Math.min(1,400/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close)bmp.close();
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));
  return blob.arrayBuffer();
}
async function videoThumb(file){
  const u=URL.createObjectURL(file);
  try{
    const v=document.createElement('video');
    v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('video'));setTimeout(()=>rej(new Error('timeout')),8000);});
    await new Promise(res=>{v.onseeked=res;setTimeout(res,3000);v.currentTime=Math.min(0.5,(v.duration||1)/2);});
    const w=v.videoWidth,h=v.videoHeight;
    if(!w||!h)throw new Error('size');
    const s=Math.min(1,400/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));
    return blob.arrayBuffer();
  }catch(e){
    const c=document.createElement('canvas');c.width=c.height=200;
    const x=c.getContext('2d');x.fillStyle='#1c1e22';x.fillRect(0,0,200,200);
    x.fillStyle='#8b8f98';x.font='80px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('▶',100,100);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));
    return blob.arrayBuffer();
  }finally{URL.revokeObjectURL(u);}
}
const MAXSIZE=200*1024*1024;
$('#picker').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length||!KEY)return;
  const albumId=view.t==='album'?view.id:null;
  let ok=0,big=0,fail=0;
  for(let i=0;i<files.length;i++){
    toast('Import '+(i+1)+' / '+files.length+'…',0);
    const f=files[i];
    if(f.size>MAXSIZE){big++;continue;}
    let id=null;
    try{
      id=newId();
      const isV=(f.type||'').startsWith('video/')||/\.(mov|mp4|m4v)$/i.test(f.name||'');
      const t=isV?await videoThumb(f):await makeThumb(f);
      await put('thumbs',{id,d:await encBuf(t)});
      await put('photos',{id,type:f.type||(isV?'video/mp4':'image/jpeg'),d:await encBuf(await f.arrayBuffer())});
      if(isV){if(!META.vids)META.vids=[];META.vids.push(id);}
      IDS.unshift(id);if(albumId)album(albumId).ids.push(id);ok++;
    }catch(err){
      console.error(err);fail++;
      if(id){await del('photos',id).catch(()=>{});await del('thumbs',id).catch(()=>{});}
    }
  }
  await saveMeta();render();
  let m=ok+' fichier'+(ok>1?'s':'')+' importé'+(ok>1?'s':'')+'.';
  if(big)m+=' '+big+' trop volumineux (> 200 Mo), ignoré'+(big>1?'s':'')+'.';
  if(fail)m+=' '+fail+' en échec.';
  if(ok)m+=' Pense à supprimer les originaux de Photos.';
  toast(m,6000);
};

/* ---------- Corbeille ---------- */
async function trashPhotos(pids){
  const now=Date.now();
  for(const id of pids){
    META.trash.push({id,at:now,albums:META.albums.filter(a=>a.ids.includes(id)).map(a=>a.id)});
  }
  for(const a of META.albums)a.ids=a.ids.filter(i=>!pids.includes(i));
  IDS=IDS.filter(i=>!pids.includes(i));
  sel=null;await saveMeta();render();
  toast(cnt(pids.length)+' dans la corbeille (restaurable '+TRASH_DAYS+' jours)',3500);
}
async function restoreTrash(pids){
  for(const id of pids){
    const t=META.trash.find(x=>x.id===id);
    if(t)for(const aid of t.albums||[]){const a=album(aid);if(a&&!a.ids.includes(id))a.ids.push(id);}
  }
  META.trash=META.trash.filter(t=>!pids.includes(t.id));
  IDS=[...new Set([...IDS,...pids])].sort().reverse();
  sel=new Set();await saveMeta();render();
  toast(cnt(pids.length)+' restauré'+(pids.length>1?'s':''));
}
async function purge(pids,quiet){
  for(const id of pids){
    await del('photos',id);await del('thumbs',id);
    if(thumbURL.has(id)){URL.revokeObjectURL(thumbURL.get(id));thumbURL.delete(id);}
  }
  META.trash=META.trash.filter(t=>!pids.includes(t.id));
  META.vids=(META.vids||[]).filter(i=>!pids.includes(i));
  IDS=IDS.filter(i=>!pids.includes(i));
  for(const a of META.albums)a.ids=a.ids.filter(i=>!pids.includes(i));
  await saveMeta();
  if(!quiet){sel=new Set();render();}
}
async function purgeAsk(pids){
  if(!confirm('Supprimer définitivement '+cnt(pids.length)+' ? Cette action est irréversible.'))return;
  await purge(pids);
}
async function emptyTrash(){
  const ids=trashIds();if(!ids.length)return;
  if(!confirm('Vider la corbeille ('+cnt(ids.length)+') ? Cette action est irréversible.'))return;
  await purge(ids);
}

// À appeler directement depuis un clic : iOS exige un geste de l’utilisateur pour ouvrir le menu de partage.
function shareFiles(files){
  if(navigator.canShare&&navigator.canShare({files})){
    navigator.share({files}).catch(e=>{
      if(e&&e.name==='AbortError')return;
      toast('Partage impossible : téléchargement des fichiers…',3500);downloadFiles(files);
    });
  }else downloadFiles(files);
}
function downloadFiles(files){
  files.forEach((f,i)=>setTimeout(()=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  },i*400));
}
async function prepareExport(pids){
  const files=[];let total=0,skipped=0;
  try{
    for(let i=0;i<pids.length;i++){
      toast('Préparation '+(i+1)+' / '+pids.length+'…',0);
      const rec=await get('photos',pids[i]);if(!rec)continue;
      if(files.length&&total+rec.d.byteLength>EXPORT_MAX){skipped=pids.length-i;break;}
      const buf=await decBuf(rec.d);
      total+=buf.byteLength;
      files.push(new File([buf],exportName(pids[i],rec.type),{type:rec.type}));
    }
  }catch(e){console.error(e);toast('Échec de la préparation');return;}
  $('#toast')&&($('#toast').hidden=true);
  if(!files.length)return;
  openExportSheet(files,total,skipped);
}
function openExportSheet(files,total,skipped){
  const bg=$('#sheetbg'),sh=$('#sheet');
  sh.innerHTML='';
  const h=document.createElement('h3');h.textContent='Exporter vers Photos';sh.append(h);
  const p=document.createElement('p');
  p.style.cssText='color:var(--mut);font-size:14px;line-height:1.45;margin:0 0 14px';
  p.textContent=cnt(files.length)+' prêt'+(files.length>1?'s':'')+' ('+mb(total)+'). Appuie sur le bouton, puis choisis « Enregistrer l’image » ou « Enregistrer la vidéo » dans le menu iOS. Les originaux restent dans le Coffre.'+(skipped?' '+skipped+' autre'+(skipped>1?'s':'')+' non inclus (limite par lot) : relance l’export pour '+(skipped>1?'eux':'lui')+'.':'');
  sh.append(p);
  const go=btn('Enregistrer dans Photos',()=>shareFiles(files),'p');go.style.width='100%';sh.append(go);
  const dl=btn('Télécharger les fichiers',()=>downloadFiles(files),'');dl.style.cssText='width:100%;margin-top:10px';sh.append(dl);

  bg.hidden=false;
}

let chromeHidden=false,hideT=null,seekDrag=false;

function setChrome(show){chromeHidden=!show;$('#viewer').classList.toggle('hide',!show);clearTimeout(hideT);if(show)armHide();}

/* ---------- Zoom : pincer, glisser, double-tap (photos et vidéos) ---------- */
const Z={s:1,x:0,y:0}, ZMAX=6, zoomEl=$('#vzoom'), wrapEl=$('#vwrap');
let G=null, lastTap={t:0,x:0,y:0}, tapTimer=null;
const curMedia=()=>$('#vvid').hidden?$('#vimg'):$('#vvid');
function fitSize(){
  const m=curMedia(),W=wrapEl.clientWidth,H=wrapEl.clientHeight;
  const nw=m.id==='vvid'?m.videoWidth:m.naturalWidth, nh=m.id==='vvid'?m.videoHeight:m.naturalHeight;
  if(!nw||!nh)return {W,H,cw:W,ch:H};
  const f=Math.min(W/nw,H/nh);
  return {W,H,cw:nw*f,ch:nh*f};
}
function clampZ(){
  const {W,H,cw,ch}=fitSize();
  const bx=Math.max(0,(cw*Z.s-W)/2), by=Math.max(0,(ch*Z.s-H)/2);
  Z.x=Math.max(-bx,Math.min(bx,Z.x));Z.y=Math.max(-by,Math.min(by,Z.y));
}
function applyZ(anim){
  zoomEl.classList.toggle('anim',!!anim);
  zoomEl.style.transform=(Z.s===1&&!Z.x&&!Z.y)?'':'translate('+Z.x+'px,'+Z.y+'px) scale('+Z.s+')';
}
function resetZoom(anim){Z.s=1;Z.x=0;Z.y=0;applyZ(anim);}
const tdist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
function local(x,y){const r=wrapEl.getBoundingClientRect();return {x:x-r.left,y:y-r.top};}
wrapEl.addEventListener('gesturestart',e=>e.preventDefault());
wrapEl.addEventListener('touchstart',e=>{
  if(!V)return;
  zoomEl.classList.remove('anim');
  const ts=e.touches;
  if(ts.length>=2){
    clearTimeout(tapTimer);
    G={mode:'pinch',d0:tdist(ts[0],ts[1])||1,s0:Z.s,x0:Z.x,y0:Z.y,
       f0:local((ts[0].clientX+ts[1].clientX)/2,(ts[0].clientY+ts[1].clientY)/2)};
  }else{
    G={mode:'one',sx:ts[0].clientX,sy:ts[0].clientY,x0:Z.x,y0:Z.y,moved:false,onVideo:e.target.id==='vvid'};
  }
},{passive:false});
wrapEl.addEventListener('touchmove',e=>{
  if(!V||!G)return;
  const ts=e.touches,W=wrapEl.clientWidth,H=wrapEl.clientHeight;
  if(G.mode==='pinch'&&ts.length>=2){
    e.preventDefault();
    const f=local((ts[0].clientX+ts[1].clientX)/2,(ts[0].clientY+ts[1].clientY)/2);
    const s=Math.max(1,Math.min(ZMAX,G.s0*tdist(ts[0],ts[1])/G.d0));
    const px=(G.f0.x-W/2-G.x0)/G.s0, py=(G.f0.y-H/2-G.y0)/G.s0;   // point de l’image sous les doigts au départ
    Z.s=s;Z.x=f.x-W/2-s*px;Z.y=f.y-H/2-s*py;
    clampZ();applyZ(false);
  }else if(G.mode==='one'&&ts.length===1){
    const dx=ts[0].clientX-G.sx,dy=ts[0].clientY-G.sy;
    if(Math.abs(dx)>8||Math.abs(dy)>8)G.moved=true;
    if(Z.s>1.01){e.preventDefault();Z.x=G.x0+dx;Z.y=G.y0+dy;clampZ();applyZ(false);}
  }
},{passive:false});
wrapEl.addEventListener('touchend',e=>{
  if(!V||!G)return;
  const g=G;
  if(g.mode==='pinch'){
    if(e.touches.length===0){G=null;if(Z.s<1.05)resetZoom(true);}
    else G={mode:'one',sx:e.touches[0].clientX,sy:e.touches[0].clientY,x0:Z.x,y0:Z.y,moved:true,onVideo:false,pinched:true};
    return;
  }
  G=null;
  if(g.pinched)return;
  const t=e.changedTouches[0],dx=t.clientX-g.sx,dy=t.clientY-g.sy;
  if(g.moved){
    // balayage horizontal : photo suivante / précédente (uniquement sans zoom)
    if(Z.s<=1.01&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){
      if(dx<0&&V.i<V.ids.length-1){V.i++;showV();}
      else if(dx>0&&V.i>0){V.i--;showV();}
    }
    return;
  }
  // simple appui
  const f=local(t.clientX,t.clientY),W=wrapEl.clientWidth,H=wrapEl.clientHeight;
  const now=Date.now();
  if(now-lastTap.t<300&&Math.hypot(t.clientX-lastTap.x,t.clientY-lastTap.y)<40){
    clearTimeout(tapTimer);lastTap.t=0;e.preventDefault();
    if(Z.s>1.01)resetZoom(true);
    else{const s=2.5;Z.s=s;Z.x=-(f.x-W/2)*(s-1);Z.y=-(f.y-H/2)*(s-1);clampZ();applyZ(true);}
  }else{
    lastTap={t:now,x:t.clientX,y:t.clientY};
    // simple appui : affiche / masque les barres (court délai pour laisser passer un double-appui)
    tapTimer=setTimeout(()=>setChrome(chromeHidden),280);
  }
},{passive:false});
wrapEl.addEventListener('touchcancel',()=>{G=null;});

/* ---------- Backup ---------- */
const b64=buf=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(new Blob([buf]));});
const unb64=async s=>(await (await fetch('data:application/octet-stream;base64,'+s)).arrayBuffer());
function backupMenu(){
  const a=prompt('Sauvegarde\nTape 1 pour exporter une sauvegarde chiffrée (.vault).\nPour restaurer, efface d’abord les données du site puis utilise « Restaurer » à l’écran de création.');
  if(a==='1')exportBackup();
}
async function exportBackup(){
  toast('Préparation de la sauvegarde…',0);
  try{
    const items=[];let body=new Blob([]);
    for(const id of await keys('thumbs')){
      const p=await get('photos',id),t=await get('thumbs',id);
      if(!p||!t)continue;
      items.push({id,type:p.type,pl:p.d.byteLength,tl:t.d.byteLength});
      body=new Blob([body,p.d,t.d]);
    }
    const hdr=E.encode(JSON.stringify({v:2,salt:Array.from(await kvGet('salt')),check:await b64(await kvGet('check')),meta:await b64(await kvGet('meta')),items}));
    const len=new Uint8Array(4);new DataView(len.buffer).setUint32(0,hdr.length);
    const blob=new Blob([E.encode('CFR2'),len,hdr,body],{type:'application/octet-stream'});
    const file=new File([blob],'coffre-'+new Date().toISOString().slice(0,10)+'.vault',{type:'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();}
    toast('Sauvegarde prête');
  }catch(e){if(e.name!=='AbortError')toast('Échec de la sauvegarde');else toast('Annulé');}
}
$('#restore').onclick=()=>$('#restoref').click();
$('#restoref').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    toast('Restauration…',0);
    await kvDel('fid').catch(()=>{});
    if(D.decode(await f.slice(0,4).arrayBuffer())==='CFR2'){
      const hl=new DataView(await f.slice(4,8).arrayBuffer()).getUint32(0);
      const h=JSON.parse(D.decode(await f.slice(8,8+hl).arrayBuffer()));
      await kvSet('salt',new Uint8Array(h.salt));
      await kvSet('check',await unb64(h.check));
      await kvSet('meta',await unb64(h.meta));
      let off=8+hl;
      for(const it of h.items){
        const pd=await f.slice(off,off+it.pl).arrayBuffer();off+=it.pl;
        const td=await f.slice(off,off+it.tl).arrayBuffer();off+=it.tl;
        await put('photos',{id:it.id,type:it.type,d:pd});
        await put('thumbs',{id:it.id,d:td});
      }
    }else{
      const o=JSON.parse(await f.text());
      await kvSet('salt',new Uint8Array(o.salt));
      await kvSet('check',await unb64(o.check));
      await kvSet('meta',await unb64(o.meta));
      for(const p of o.photos){
        await put('photos',{id:p.id,type:p.type,d:await unb64(p.d)});
        await put('thumbs',{id:p.id,d:await unb64(p.t)});
      }
    }
    toast('Sauvegarde restaurée. Entre ton code d’origine.',4000);
    boot();
  }catch(err){console.error(err);toast('Fichier invalide');}
};

/* ---------- Init ---------- */
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
